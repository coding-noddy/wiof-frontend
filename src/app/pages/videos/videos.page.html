<app-header></app-header>

<ion-content>
  <div class="videos-page" [ngClass]="element">

    <!-- Header -->
    <div class="videos-header" [ngClass]="element">
      <h1 class="header-title">{{ category }} Videos</h1>
      <div class="header-actions">
        <a
          [routerLink]="['take-action']"
          class="action-link"
          title="Go to Take Action"
          aria-label="Go to Take Action"
        >
          <ion-icon name="trail-sign-outline"></ion-icon>
        </a>
        <app-back-button></app-back-button>
      </div>
    </div>

    <!-- Video grid -->
    <div *ngIf="videos | async as videosList; else loading" class="videos-grid-wrap">
      <div class="videos-grid" *ngIf="videosList.length > 0">
        <ion-grid>
          <ion-row>
            <ion-col
              size="12"
              size-sm="6"
              size-md="4"
              size-lg="3"
              *ngFor="let video of videosList"
            >
              <app-video-card [video]="video" [element]="element"></app-video-card>
            </ion-col>
          </ion-row>
        </ion-grid>
      </div>

      <div *ngIf="videosList && videosList.length === 0" class="no-content">
        <ion-icon name="videocam-off-outline"></ion-icon>
        <p>No videos found under <strong>{{ category }}</strong> category.</p>
      </div>
    </div>

    <ng-template #loading>
      <div class="videos-loading">
        <ion-grid>
          <ion-row>
            <ion-col size="12" size-sm="6" size-md="4" size-lg="3" *ngFor="let i of [1,2,3,4,5,6,7,8]">
              <div class="skeleton" style="height: 180px; border-radius: 12px; margin-bottom: 0.5rem;"></div>
              <div class="skeleton" style="height: 14px; width: 80%; border-radius: 6px; margin-bottom: 0.4rem;"></div>
              <div class="skeleton" style="height: 12px; width: 50%; border-radius: 6px;"></div>
            </ion-col>
          </ion-row>
        </ion-grid>
      </div>
    </ng-template>

  </div>

  <app-wiof-footer></app-wiof-footer>
</ion-content>
