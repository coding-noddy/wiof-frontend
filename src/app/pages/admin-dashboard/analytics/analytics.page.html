<ion-header>
  <ion-toolbar>
    <ion-title>Analytics</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <div class="admin-page">
    <nav class="breadcrumb">
      <a routerLink="/admin-dashboard">Dashboard</a>
      <span class="separator">/</span>
      <span class="current">Analytics</span>
    </nav>

    <div class="admin-page-header">
      <div>
        <h1>Daily Visitor Analytics</h1>
        <p class="header-meta">Visitor and engagement activity over the last 30 days</p>
      </div>
      <a class="back-dashboard-link" routerLink="/admin-dashboard">
        <ion-icon name="arrow-back-outline"></ion-icon>
        Back to Dashboard
      </a>
    </div>

    <div class="chart-card">
      <div class="chart-container">
        <canvas baseChart
          [type]="lineChartType"
          [data]="lineChartData"
          [options]="lineChartOptions">
        </canvas>
      </div>
    </div>
  </div>
</ion-content>
