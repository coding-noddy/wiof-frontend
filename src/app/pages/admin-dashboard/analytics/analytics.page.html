<ion-header>
  <ion-toolbar>
    <ion-title>Analytics</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <div class="admin-page">
    <div class="admin-page-header">
      <h1>Daily Visitor Analytics</h1>
    </div>

    <div class="chart-card">
      <div class="chart-container">
        <canvas baseChart
          [type]="lineChartType"
          [data]="lineChartData"
          [options]="lineChartOptions">
        </canvas>
      </div>
    </div>
  </div>
</ion-content>
