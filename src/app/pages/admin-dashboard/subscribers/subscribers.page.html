<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/admin-dashboard"></ion-back-button>
    </ion-buttons>
    <ion-title>Subscribers</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <div class="admin-page">
    <nav class="breadcrumb">
      <a routerLink="/admin-dashboard">Dashboard</a>
      <span class="separator">/</span>
      <span class="current">Subscribers</span>
    </nav>

    <div class="admin-page-header">
      <div>
        <h1>Newsletter Subscribers</h1>
        <p class="header-meta">{{ summary.total }} unique subscribers</p>
      </div>
      <div class="header-actions">
        <button class="btn-primary" (click)="generateExcel()">
          <ion-icon name="download-outline"></ion-icon> Export Excel
        </button>
      </div>
    </div>

    <!-- Summary -->
    <div class="summary-row">
      <div class="summary-card">
        <div class="summary-icon green"><ion-icon name="mail-outline"></ion-icon></div>
        <div class="summary-info">
          <span class="summary-value">{{ summary.total }}</span>
          <span class="summary-label">Total Subscribers</span>
        </div>
      </div>
    </div>

    <!-- Table -->
    <div class="admin-table-card" *ngIf="subscribersJson?.length > 0">
      <table class="admin-table">
        <thead>
          <tr>
            <th>#</th>
            <th (click)="sortBy('firstName')" [class.sorted]="sortColumn === 'firstName'">
              <span class="sort-header">First Name <ion-icon class="sort-icon" [name]="sortColumn === 'firstName' && sortDirection === 'asc' ? 'arrow-up' : 'arrow-down'"></ion-icon></span>
            </th>
            <th (click)="sortBy('lastName')" [class.sorted]="sortColumn === 'lastName'">
              <span class="sort-header">Last Name <ion-icon class="sort-icon" [name]="sortColumn === 'lastName' && sortDirection === 'asc' ? 'arrow-up' : 'arrow-down'"></ion-icon></span>
            </th>
            <th (click)="sortBy('email')" [class.sorted]="sortColumn === 'email'">
              <span class="sort-header">Email <ion-icon class="sort-icon" [name]="sortColumn === 'email' && sortDirection === 'asc' ? 'arrow-up' : 'arrow-down'"></ion-icon></span>
            </th>
            <th (click)="sortBy('datetime')" [class.sorted]="sortColumn === 'datetime'">
              <span class="sort-header">Subscribed <ion-icon class="sort-icon" [name]="sortColumn === 'datetime' && sortDirection === 'asc' ? 'arrow-up' : 'arrow-down'"></ion-icon></span>
            </th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let sub of subscribersJson; let i = index">
            <td>{{ i + 1 }}</td>
            <td><span class="cell-title">{{ sub.firstName | titlecase }}</span></td>
            <td>{{ sub.lastName | titlecase }}</td>
            <td>{{ sub.email }}</td>
            <td><span class="cell-date">{{ sub.datetime || '—' }}</span></td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</ion-content>
