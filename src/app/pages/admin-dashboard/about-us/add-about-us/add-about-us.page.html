<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/admin-dashboard/manage-about-us"></ion-back-button>
    </ion-buttons>
    <ion-title>{{ isEditMode ? 'Edit Profile' : 'Add Team Profile' }}</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <div class="admin-form-page">
    <nav class="breadcrumb">
      <a routerLink="/admin-dashboard">Dashboard</a>
      <span class="separator">/</span>
      <a routerLink="/admin-dashboard/manage-about-us">Team</a>
      <span class="separator">/</span>
      <span class="current">{{ isEditMode ? 'Edit' : 'New' }}</span>
    </nav>

    <div class="form-header">
      <h1>{{ isEditMode ? 'Edit Team Profile' : 'New Team Profile' }}</h1>
      <div class="form-actions">
        <button class="btn-secondary" routerLink="/admin-dashboard/manage-about-us">Cancel</button>
        <button class="btn-primary" (click)="onSubmit()" [disabled]="addProfileForm.invalid">
          <ion-icon name="checkmark-outline"></ion-icon> Save
        </button>
      </div>
    </div>

    <form [formGroup]="addProfileForm">
      <!-- Photo Card -->
      <div class="form-card">
        <div class="form-card-title"><ion-icon name="camera-outline"></ion-icon> Profile Photo</div>
        <div style="text-align: center; padding: 16px 0;">
          <ion-img
            [src]="imageToDisplay || 'assets/placeholder.png'"
            style="width: 120px; height: 120px; margin: 0 auto; border-radius: 50%; overflow: hidden; object-fit: cover; border: 3px solid #e5e7eb;">
          </ion-img>
          <div style="margin-top: 12px;">
            <input type="file" id="file-upload" (change)="onFileChange($event)" accept="image/*" style="display: none;" #fileInput>
            <button class="btn-secondary" (click)="fileInput.click()">
              <ion-icon name="cloud-upload-outline"></ion-icon> {{ isImageSelected ? 'Change Photo' : 'Upload Photo' }}
            </button>
            <button class="btn-secondary" *ngIf="isImageSelected" (click)="removeImage()" style="color: #ef4444; border-color: #fca5a5;">
              <ion-icon name="trash-outline"></ion-icon> Remove
            </button>
          </div>
        </div>
      </div>

      <!-- Details Card -->
      <div class="form-card">
        <div class="form-card-title"><ion-icon name="person-outline"></ion-icon> Profile Details</div>
        <div class="form-row">
          <ion-item>
            <ion-label position="floating">Serial Number *</ion-label>
            <ion-input type="number" formControlName="serialNo" placeholder="e.g. 1"></ion-input>
          </ion-item>
          <ion-item>
            <ion-label position="floating">Full Name *</ion-label>
            <ion-input type="text" formControlName="name" placeholder="Enter name"></ion-input>
          </ion-item>
        </div>
        <div class="form-row full-width">
          <ion-item>
            <ion-label position="floating">Social Media Link (LinkedIn/Twitter)</ion-label>
            <ion-input type="url" formControlName="socialLink" placeholder="https://..."></ion-input>
          </ion-item>
        </div>
        <div class="form-row full-width">
          <ion-item>
            <ion-label position="floating">Biography *</ion-label>
            <ion-textarea formControlName="bio" rows="4" auto-grow="true" placeholder="Write a short bio..."></ion-textarea>
          </ion-item>
        </div>
      </div>
    </form>
  </div>
</ion-content>
