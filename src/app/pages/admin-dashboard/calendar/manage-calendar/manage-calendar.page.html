<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/admin-dashboard"></ion-back-button>
    </ion-buttons>
    <ion-title>Calendar</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <div class="admin-page">
    <div class="admin-page-header">
      <div>
        <h1>Manage Calendar</h1>
        <p class="header-meta" *ngIf="occasionsList$ | async as occasionsList">{{ occasionsList.length }} occasions</p>
      </div>
      <div class="header-actions">
        <button class="btn-secondary" (click)="refreshData()">
          <ion-icon name="refresh-outline"></ion-icon> Refresh
        </button>
        <button class="btn-primary" (click)="addNewOccasion()">
          <ion-icon name="add-outline"></ion-icon> Add Occasion
        </button>
      </div>
    </div>

    <div class="filter-bar" *ngIf="occasionsList$ | async as occasionsList">
      <select class="filter-select" [ngModel]="selectedMonth" (ngModelChange)="onSelectMonth($event)">
        <option [ngValue]="i" *ngFor="let month of months; let i = index">{{ month }}</option>
      </select>
      <span class="filter-count">{{ occasionsList.length }} occasions in {{ months[selectedMonth] }}</span>
    </div>

    <div class="admin-table-card">
      <table class="admin-table" *ngIf="occasionsList$ | async as occasionsList">
        <thead>
          <tr>
            <th>#</th>
            <th>Occasion</th>
            <th>Date</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let occasion of occasionsList; let i = index">
            <td>{{ i + 1 }}</td>
            <td>
              <div class="cell-with-thumb">
                <img class="cell-thumbnail" *ngIf="occasion.image | async as imgUrl" [src]="imgUrl" [alt]="occasion.occasion">
                <span class="cell-title">{{ occasion.occasion }}</span>
              </div>
            </td>
            <td><span class="cell-date">{{ months[occasion.month] }} {{ occasion.day }}</span></td>
            <td>
              <div class="action-buttons">
                <button class="action-btn view" title="Edit occasion" (click)="viewOccasionDetails(occasion)">
                  <ion-icon name="create-outline"></ion-icon>
                </button>
                <button class="action-btn delete" title="Delete occasion" (click)="deleteOccasion(occasionsList, i, occasion.id, occasion.imageName)">
                  <ion-icon name="trash-outline"></ion-icon>
                </button>
              </div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</ion-content>
