<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/admin-dashboard"></ion-back-button>
    </ion-buttons>
    <ion-title>Add Blog</ion-title>
    <ion-buttons slot="end">
      <ion-button color="success" fill="solid" size="large" (click)="onSubmit()"
        >Save</ion-button
      >
      <ion-button
        color="medium"
        fill="clear"
        size="large"
        routerLink="/admin-dashboard"
        >Cancel</ion-button
      >
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content>
  <form [formGroup]="addBlogForm">
    <ion-grid>
      <ion-row>
        <ion-col size-xs="12" size-md="6"
          ><ion-item>
            <ion-label position="floating">Blog Title</ion-label>
            <ion-input formControlName="title"></ion-input>
          </ion-item>
        </ion-col>

        <ion-col size-xs="12" size-md="6"
          ><ion-item>
            <ion-label position="floating">Author Name</ion-label>
            <ion-input formControlName="authorName"></ion-input>
          </ion-item>
        </ion-col>

        <ion-col size-xs="12" size-md="6"
          ><ion-item>
            <ion-label position="floating">Category</ion-label>
            <ion-select formControlName="category">
              <ion-select-option
                [value]="category"
                *ngFor="let category of categories"
                >{{ category }}</ion-select-option
              >
            </ion-select>
          </ion-item>
        </ion-col>

        <ion-col size-xs="12" size-md="6"
          ><ion-item>
            <ion-label position="floating">Sub Category</ion-label>
            <ion-input formControlName="subCategory"></ion-input>
          </ion-item>
        </ion-col>

        <ion-col size-xs="12"
          ><ion-item>
            <ion-label position="stacked">Blog Image</ion-label>
            <ion-input
              type="file"
              accept="image/*"
              (change)="onFileSelected($event)"
              formControlName="image"
            ></ion-input>
            <ion-note slot="helper">Max file size {{ maxImageMB }} MB. Recommended JPG/PNG.</ion-note>
            <div><ion-img [src]="imageToDisplay"></ion-img></div>
          </ion-item>
        </ion-col>

        <ion-col size-xs="12"
          ><ion-item>
            <ion-label position="floating">Blog Short Description</ion-label>
            <ion-textarea
              formControlName="shortDescription"
              rows="2"
              auto-grow="true"
            ></ion-textarea>
          </ion-item>
        </ion-col>
        <ion-col size-xs="12"
          ><ion-item>
            <ion-label position="floating">About Author</ion-label>
            <ion-textarea
              formControlName="aboutAuthor"
              rows="2"
              auto-grow="true"
            ></ion-textarea>
          </ion-item>
        </ion-col>

        <ion-col size-xs="12">
          <ion-item><ion-label>Blog Content</ion-label></ion-item>
          <quill-editor
            formControlName="content"
            [modules]="quillModules"
            (onEditorCreated)="onEditorCreated($event)"
          ></quill-editor>
        </ion-col>
      </ion-row>
    </ion-grid>
  </form>
</ion-content>
