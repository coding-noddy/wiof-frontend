<!-- home.page.html -->
<app-header></app-header>
<app-subscribe [page]="'home'"></app-subscribe>
<app-social-share style="z-index: 2"></app-social-share>
<app-concent-popup *ngIf="viewConsentPopup" (accepted)="onAccept()"></app-concent-popup>

<ion-content>
  <!-- Banner / Hero Section — intentionally full-bleed, outside .page-container -->
  <section class="hero">
    <svg class="hero-rays" viewBox="0 0 1440 620" preserveAspectRatio="none" aria-hidden="true">
      <line x1="-40" y1="640" x2="220" y2="120" />
      <line x1="10" y1="660" x2="320" y2="90" />
      <line x1="70" y1="680" x2="430" y2="70" />
      <line x1="150" y1="690" x2="540" y2="60" />
      <line x1="250" y1="700" x2="650" y2="70" />
    </svg>
    <div class="hero-copy">
      <p class="eyebrow">World is One Family</p>
      <h1>
        Inspire through Creativity<br />
        Enlighten through Knowledge<br />
        Protect through Action
      </h1>
      <button class="cta" (click)="scrollToElements()">Discover More</button>
    </div>
  </section>

  <div class="page-container">
    <app-life-elements></app-life-elements>

    <!-- Coffee Conversation -->
    <section class="section-block conversation-section">
      <app-coffee-conversation
        [coffeeConvList]="coffeeConversations$ | async"
        [fromHomePage]="true">
      </app-coffee-conversation>
    </section>

    <!-- Continue Your Journey / Guest Invite -->
    <section class="section-block journey-section">
      <app-home-journey-panel></app-home-journey-panel>
    </section>

    <!-- This Week: Breaking News (2/3) + Poll (1/3) -->
    <section class="section-block this-week-row">
      <div class="section-header">
        <p class="eyebrow">Happening now</p>
        <h2>This Week</h2>
      </div>
      <ion-grid>
        <ion-row>
          <ion-col size-xs="12" size-md="8">
            <app-breaking-news [newsList]="newsList$ | async"></app-breaking-news>
          </ion-col>
          <ion-col size-xs="12" size-md="4">
            <app-polls-widget></app-polls-widget>
          </ion-col>
        </ion-row>
      </ion-grid>
    </section>

    <!-- Explore: NGO In Focus + Course In Focus -->
    <section class="section-block impact-row">
      <div class="section-header">
        <p class="eyebrow">Get curious</p>
        <h2>Explore</h2>
      </div>
      <ion-grid>
        <ion-row>
          <ion-col size-xs="12" size-md="6">
            <app-ngo-in-focus [ngosInFocus]="ngosInFocus$ | async"></app-ngo-in-focus>
          </ion-col>
          <ion-col size-xs="12" size-md="6">
            <app-course-in-focus [coursesInFocus]="coursesInFocus$ | async"></app-course-in-focus>
          </ion-col>
        </ion-row>
      </ion-grid>
    </section>

    <!-- Environment Calendar + Today/Tomorrow agenda -->
    <section class="section-block bottom-row">
      <div class="section-header">
        <p class="eyebrow">Get involved</p>
        <h2>Environment Calendar</h2>
      </div>
      <ion-grid>
        <ion-row>
          <ion-col size-xs="12" size-md="8">
            <app-env-calender></app-env-calender>
          </ion-col>
          <ion-col size-xs="12" size-md="4">
            <app-env-calendar-agenda></app-env-calendar-agenda>
          </ion-col>
        </ion-row>
      </ion-grid>
    </section>
  </div>

  <app-wiof-footer></app-wiof-footer>
</ion-content>
