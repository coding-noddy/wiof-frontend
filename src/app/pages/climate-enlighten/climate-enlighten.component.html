<app-header></app-header>
<ion-content>
  <div class="page-wrapper">

    <header class="logo-banner">
      <p class="eyebrow">Climate education</p>
      <img src="assets/ClimateEnlighten.png" alt="Climate Enlighten Logo" class="header-logo">
      <p class="tagline">Simplifying climate and sustainability learning, one phase at a time.</p>
    </header>

    <section class="climate-container">
      <div class="cards-grid">
        <div class="card" *ngFor="let card of cards">

          <div class="card-header">
            <span class="launch-badge">{{ card.launchDate }}</span>
            <h2>{{ card.title }}</h2>
          </div>

          <div class="card-body">
            <ul class="topic-list">
              <li *ngFor="let topic of card.topics">{{ topic }}</li>
            </ul>
          </div>

          <div class="card-footer">
            <a *ngIf="!card.isDisabled" [href]="card.formLink" target="_blank" class="enquire-btn">
              Enquire Now
            </a>

            <a *ngIf="card.isDisabled" class="enquire-btn disabled-btn">
              Coming Soon
            </a>
          </div>

        </div>
      </div>
    </section>
  </div>

  <app-wiof-footer></app-wiof-footer>
</ion-content>
