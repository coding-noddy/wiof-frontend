<app-header></app-header>
<ion-content>
  <div class="video-post-wrapper" *ngIf="urlSafe; else loading">

    <!-- Video player -->
    <div class="video-player-wrap">
      <iframe
        class="video-player"
        [title]="videoTitle"
        [src]="urlSafe"
        allowfullscreen
        appYoutubeWatchTracker
        [contentId]="id"
        [videoTitle]="videoTitle"
        (watchComplete)="onWatchComplete($event)"
      ></iframe>
    </div>

    <!-- Content -->
    <article class="video-article">

      <!-- Meta top -->
      <div class="video-meta-top">
        <app-back-button></app-back-button>
        <app-bookmark-icon
          [contentId]="id"
          contentType="video"
          [contentTitle]="videoTitle"
          [contentThumbnail]="videoThumbnail">
        </app-bookmark-icon>
        <app-social-share></app-social-share>
      </div>

      <!-- Title -->
      <h1 class="video-title">{{ videoTitle }}</h1>

      <!-- Channel -->
      <div class="video-channel" *ngIf="videoChannelName">
        <ion-icon name="logo-youtube"></ion-icon>
        <span>{{ videoChannelName }}</span>
      </div>

      <hr class="video-divider" />

      <!-- Description -->
      <div class="video-description" *ngIf="videoDescription">
        <h4>Description</h4>
        <p
          [class.collapsed]="showFullVideoDescription"
        >{{ videoDescription }}</p>
        <button class="toggle-desc" (click)="toggleVideoDescription()">
          {{ showFullVideoDescription ? 'Show More' : 'Show Less' }}
          <ion-icon [name]="showFullVideoDescription ? 'chevron-down-outline' : 'chevron-up-outline'"></ion-icon>
        </button>
      </div>

    </article>
  </div>

  <ng-template #loading>
    <div class="video-loading">
      <div class="skeleton" style="width: 100%; padding-top: 56.25%; border-radius: 0;"></div>
      <div style="max-width: 780px; margin: 1.5rem auto; padding: 0 1rem;">
        <div class="skeleton" style="height: 28px; width: 70%; border-radius: 6px; margin-bottom: 1rem;"></div>
        <div class="skeleton" style="height: 14px; width: 40%; border-radius: 6px; margin-bottom: 2rem;"></div>
        <div class="skeleton" style="height: 12px; width: 100%; border-radius: 6px; margin-bottom: 0.5rem;"></div>
        <div class="skeleton" style="height: 12px; width: 90%; border-radius: 6px;"></div>
      </div>
    </div>
  </ng-template>

  <app-wiof-footer></app-wiof-footer>
</ion-content>
