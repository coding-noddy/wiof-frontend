<ion-content>
  <div class="login-page">
    <div class="login-card">
      <a routerLink="/home" class="login-logo-link">
        <ion-img class="login-logo" alt="WIOF" [src]="wiofLogo"></ion-img>
      </a>

      <p class="login-eyebrow">Admin Access</p>
      <h1 class="login-title">Sign in to WIOF</h1>
      <p class="login-subtitle">Manage content for World Is One Family</p>

      <div *ngIf="error" class="login-error">
        <ion-icon aria-hidden="true" name="alert-circle-outline"></ion-icon>
        <p>{{ error }}</p>
      </div>

      <form class="login-form" (ngSubmit)="onLogin()">
        <label class="login-field">
          <span class="login-field-label">Email</span>
          <input
            type="email"
            name="email"
            autocomplete="email"
            [(ngModel)]="email"
            placeholder="you@worldisonefamily.com"
          />
        </label>

        <label class="login-field">
          <span class="login-field-label">Password</span>
          <input
            type="password"
            name="password"
            autocomplete="current-password"
            [(ngModel)]="password"
            placeholder="••••••••"
          />
        </label>

        <button type="submit" class="login-submit-btn">
          Sign In
          <ion-icon aria-hidden="true" name="arrow-forward-outline"></ion-icon>
        </button>
      </form>

      <div class="login-divider" role="separator"><span>or</span></div>

      <!-- Same Google sign-in as the site header; admin rights come from the
           admins collection, not the sign-in method. -->
      <button type="button" class="login-google-btn" (click)="onGoogleLogin()" [disabled]="signingInWithGoogle">
        <ion-icon aria-hidden="true" name="logo-google"></ion-icon>
        {{ signingInWithGoogle ? 'Signing in…' : 'Continue with Google' }}
      </button>
    </div>
  </div>
</ion-content>
