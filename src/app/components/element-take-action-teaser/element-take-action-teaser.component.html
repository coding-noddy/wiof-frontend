<div class="take-action-teaser" *ngIf="actions.length">
  <p class="eyebrow">Take action</p>
  <h2>Small shifts, real impact</h2>
  <div class="teaser-grid">
    <app-take-action-card
      *ngFor="let action of actions"
      [action]="action"
    ></app-take-action-card>
  </div>
  <a class="view-more-link" [routerLink]="['/element', element, 'take-action']">
    Explore More {{ element | titlecase }} Actions
    <ion-icon name="arrow-forward-outline"></ion-icon>
  </a>
</div>
