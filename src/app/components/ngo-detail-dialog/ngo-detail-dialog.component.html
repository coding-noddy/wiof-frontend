<div class="ngo-modal">

  <!-- Header -->
  <div class="ngo-modal-header">
    <div class="ngo-modal-title-row">
      <img
        [src]="ngo.logoImage$ | async"
        class="modal-logo"
        [alt]="ngo.ngoName + ' logo'"
      />
      <h2 class="modal-name">{{ ngo.ngoName }}</h2>
    </div>
    <button class="modal-close-btn" (click)="close()" aria-label="Close">
      <ion-icon aria-hidden="true" name="close"></ion-icon>
    </button>
  </div>

  <!-- Scrollable body -->
  <div class="ngo-modal-body">
    <div class="modal-image-wrap">
      <img
        class="modal-image"
        [src]="ngo.image$ | async"
        [alt]="ngo.ngoName"
      />
    </div>
  </div>

</div>
