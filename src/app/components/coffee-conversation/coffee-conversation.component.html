<ion-card
  *ngIf="coffeeConvList && coffeeConvList.length > 0"
  class="coffee-conv-container"
  [ngClass]="[fromHomePage ? 'layout-home' : 'layout-element', coffeeConvClass]"
>
  <ion-card-header
    class="ion-align-center wiof-slider-header"
    [ngClass]="coffeeConvClass"
  >
    <ion-row>
      <ion-col class="title-text" size="12">Coffee Conversations</ion-col>
    </ion-row>
  </ion-card-header>
  <ion-card-content class="background" [ngClass]="coffeeConvClass">
    <div *ngIf="coffeeConvList; else loading">
      <swiper-container #swiperCC [attr.slides-per-view]="1" [attr.space-between]="10">
        <swiper-slide *ngFor="let coffeeConv of coffeeConvList">
          <ion-card class="coffee-conv-card">
            <ion-card-content class="ion-text-start card-content">
              <ion-row>
                <ion-col
                  class="media-container"
                  size-xs="12"
                  size-lg="6"
                >
                  <iframe
                    class="media-player"
                    [title]="coffeeConv.topic"
                    [src]="coffeeConv.sanitizedLink"
                    allowfullscreen
                    appYoutubeWatchTracker
                    [contentId]="coffeeConv.id || coffeeConv.topic"
                    [videoTitle]="coffeeConv.topic"
                    (watchComplete)="onVideoWatchComplete($event)"
                  ></iframe>
                </ion-col>
                <ion-col
                  class="coffee-conv-content"
                  size-xs="12"
                  size-lg="6"
                >
                  <h2>
                    <strong>{{ coffeeConv.topic }}</strong>
                  </h2>
                  <div class="conversation-meta">
                    <span *ngIf="coffeeConv.intervieweeName.toUpperCase() !== 'NA'">
                      <ion-icon name="person-outline"></ion-icon>
                      {{ coffeeConv.intervieweeName }}
                    </span>
                    <span>
                      <ion-icon name="chatbubble-ellipses-outline"></ion-icon>
                      Community conversation
                    </span>
                  </div>
                  <div
                    class="interviewee-details"
                    *ngIf="coffeeConv.intervieweeName.toUpperCase() !== 'NA'"
                  >
                    <button
                      class="interviewee-trigger"
                      type="button"
                      (click)="showIntervieweeDetails($event, true)"
                    >
                      <ion-icon name="person-circle-outline"></ion-icon>
                      About {{ coffeeConv.intervieweeName }}
                    </button>
                  </div>
                  <p style="margin-bottom: 20px">
                    <span [innerHTML]="coffeeConv.topicShortDesc"></span>
                  </p>
                  <p>
                    <a
                      [href]="coffeeConv.knowMoreLink"
                      target="_blank"
                      class="conversation-cta"
                      >Explore conversation <ion-icon name="arrow-forward-outline"></ion-icon></a
                    >
                  </p>
                  <div
                    class="about-interviewee"
                    *ngIf="showAboutInterviewee"
                    role="dialog"
                    aria-modal="true"
                    [attr.aria-label]="'About ' + coffeeConv.intervieweeName"
                  >
                    <div class="header">
                      <div class="header-title">
                        <ion-icon name="person-circle-outline"></ion-icon>
                        <h3>About {{ coffeeConv.intervieweeName }}</h3>
                      </div>
                      <button
                        type="button"
                        aria-label="Close interviewee details"
                        (click)="showIntervieweeDetails($event, false)"
                      >
                        <ion-icon name="close" slot="icon-only"></ion-icon>
                      </button>
                    </div>
                    <p>{{ coffeeConv.intervieweeDesc }}</p>
                  </div>
                </ion-col>
              </ion-row>
            </ion-card-content>
          </ion-card>
        </swiper-slide>
      </swiper-container>
      <button class="swiper-nav-btn prev" *ngIf="coffeeConvList.length > 1" (click)="swiperCC.swiper.slidePrev()">
        <ion-icon name="chevron-back"></ion-icon>
      </button>
      <button class="swiper-nav-btn next" *ngIf="coffeeConvList.length > 1" (click)="swiperCC.swiper.slideNext()">
        <ion-icon name="chevron-forward"></ion-icon>
      </button>
    </div>
    <ng-template #loading>
      <div style="padding: 1rem;">
        <div class="skeleton" style="height: 180px; border-radius: 12px; margin-bottom: 0.75rem;"></div>
        <div class="skeleton" style="height: 14px; width: 70%; border-radius: 6px; margin-bottom: 0.5rem;"></div>
        <div class="skeleton" style="height: 12px; width: 50%; border-radius: 6px;"></div>
      </div>
    </ng-template>
  </ion-card-content>
</ion-card>
