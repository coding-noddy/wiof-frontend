@if (groups$ | async; as groups) {
  @if (groups.length) {
    <section class="explore-next" [class.compact]="compact" [attr.aria-labelledby]="headingId">
      <h2 [id]="headingId" class="explore-next-heading">
        <ion-icon aria-hidden="true" name="compass-outline"></ion-icon>
        Explore next
      </h2>
      @for (group of groups; track group.key) {
        <div class="explore-group" [attr.data-group]="group.key">
          <h3 class="explore-group-title">
            <ion-icon aria-hidden="true" [name]="group.icon"></ion-icon>
            {{ group.title }}
          </h3>
          <ul class="explore-next-list">
            @for (item of group.items; track item.type + item.id) {
              <li>
                <a class="explore-card" [routerLink]="item.link" [queryParams]="item.queryParams" (click)="navigate.emit()">
                  <span class="explore-media" [class.is-icon]="!item.image">
                    @if (item.image) {
                      <img [src]="item.image" alt="" loading="lazy" />
                    } @else {
                      <ion-icon aria-hidden="true" [name]="item.icon"></ion-icon>
                    }
                  </span>
                  <span class="explore-text">
                    <span class="explore-type" [attr.data-type]="item.type">{{ typeLabel(item) }}</span>
                    <span class="explore-title">{{ item.title }}</span>
                  </span>
                </a>
              </li>
            }
          </ul>
        </div>
      }
    </section>
  }
}
