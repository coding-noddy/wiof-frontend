@if (!hidden) {
  @if (occasion$ | async; as occasion) {
    <!-- A small invitation: the date and the day's name. The story, the fact and
    what to read or do open in the calendar's own modal, when the reader wants them. -->
    <section class="today" aria-labelledby="today-on-wiof-title">
      <button type="button" class="today-open" (click)="openStory(occasion, $event)" aria-describedby="today-on-wiof-cta">
        @if (occasion.image | async; as image) {
          <img class="today-image" [src]="image" alt="" loading="lazy" />
        } @else {
          <span class="today-image is-icon" aria-hidden="true"><ion-icon name="calendar-outline"></ion-icon></span>
        }
        <span class="today-text">
          <span class="today-eyebrow">Today · {{ todayLabel }}</span>
          <span class="today-title" id="today-on-wiof-title" role="heading" aria-level="2">{{ occasion.occasion }}</span>
          <span class="today-cta" id="today-on-wiof-cta">
            Discover the story of this day
            <ion-icon aria-hidden="true" name="arrow-forward"></ion-icon>
          </span>
        </span>
      </button>
      <button type="button" class="today-hide" (click)="hideForToday()" aria-label="Hide for today" title="Hide for today">
        <ion-icon aria-hidden="true" name="close"></ion-icon>
      </button>

      <a class="today-calendar" href="#environment-calendar" (click)="seeCalendar($event)">
        See the full calendar
        <ion-icon aria-hidden="true" name="arrow-down"></ion-icon>
      </a>
    </section>
  }
}
