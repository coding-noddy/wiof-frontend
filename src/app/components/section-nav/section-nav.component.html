@if (sections?.length > 0) {
  <nav
    class="section-nav"
    [ngClass]="'theme-' + element"
    [class.section-nav-hidden]="!visible"
    >
    <div class="nav-scroll">
      @for (item of sections; track item) {
        <button
          class="nav-item"
          [class.active]="activeSection === item.sectionId"
          [class.disabled]="item.disabled"
          [disabled]="item.disabled"
          (click)="!item.disabled && scrollTo(item.sectionId)"
          >
          {{ item.label }}
        </button>
      }
    </div>
  </nav>
}
