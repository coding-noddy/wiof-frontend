<!-- Backdrop overlay -->
<div *ngIf="visible" class="onboarding-backdrop" (click)="dismiss()"></div>

<!-- Modal content -->
<div
  *ngIf="visible"
  class="onboarding-overlay"
  role="dialog"
  aria-label="Welcome to WIOF onboarding"
>
  <button
    class="close-btn"
    (click)="dismiss()"
    aria-label="Close onboarding overlay"
  >
    <ion-icon name="close-outline"></ion-icon>
  </button>

  <div class="overlay-content">
    <!-- Header with gradient -->
    <div class="overlay-header">
      <img src="assets/logo.png" alt="WIOF Logo" class="header-logo" />
      <h2 class="overlay-title">Welcome to WIOF</h2>
      <p class="overlay-purpose">
        Your wellness journey through the Five Elements — ancient wisdom meets modern tools.
      </p>
    </div>

    <!-- Five Elements with colorful icons -->
    <div class="elements-section">
      <h3 class="section-heading">
        <ion-icon name="layers-outline"></ion-icon>
        The Five Elements
      </h3>
      <div class="elements-grid">
        <div *ngFor="let element of elements" class="element-chip" [style.--chip-color]="element.color">
          <ion-icon [name]="element.icon" class="element-icon"></ion-icon>
          <div class="element-text">
            <span class="element-name">{{ element.name }}</span>
            <span class="element-desc">{{ element.description }}</span>
          </div>
        </div>
      </div>
    </div>

    <!-- Features with icons -->
    <div class="features-section">
      <h3 class="section-heading">
        <ion-icon name="compass-outline"></ion-icon>
        Explore
      </h3>
      <div class="features-grid">
        <div *ngFor="let feature of features" class="feature-chip">
          <ion-icon [name]="feature.icon"></ion-icon>
          <span>{{ feature.name }}</span>
        </div>
      </div>
    </div>

    <button class="got-it-btn" (click)="dismiss()">
      <ion-icon name="checkmark-circle-outline"></ion-icon>
      Got it, let's go!
    </button>
  </div>
</div>
