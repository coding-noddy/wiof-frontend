<ion-card *ngIf="newsList?.length > 0" class="breaking-news-container">
  <ion-card-header class="ion-align-center wiof-slider-header">
    <ion-card-title>Breaking NEWS</ion-card-title>
  </ion-card-header>

  <ion-card-content class="breaking-news-content">
    <div *ngIf="newsList; else loading">
      <swiper-container #swiperNews [attr.slides-per-view]="1" [attr.space-between]="1" [attr.loop]="true" [attr.autoplay-delay]="5000" class="breaking-news-slides">
        <swiper-slide *ngFor="let news of newsList">
          <div class="news-card">
            <div class="media-panel">
              <img *ngIf="news.mediaType === 'image'" class="news-media" [src]="news.image$ | async" [alt]="news.headline" />
              <div *ngIf="news.mediaType === 'video'" class="video-wrap">
                <iframe class="news-media" [title]="'Video for news ' + news.headline" [src]="news.sanitizedLink" allowfullscreen></iframe>
              </div>
            </div>

            <div class="detail-panel">
              <p class="news-date">{{ news.date | date: 'EEE, MMM dd YYYY' }}</p>
              <h3 class="news-headline">{{ news.headline }}</h3>
              <div class="news-content" [innerHTML]="news.content"></div>
              <a *ngIf="news.newsSource" [href]="news.newsSource" target="_blank" rel="noopener" class="wiof-primary-link">Read Full Story →</a>
            </div>
          </div>
        </swiper-slide>
      </swiper-container>

      <div class="news-marquee">
        <div [ngStyle]="{ 'animation-duration': newsList.length * 10 + 's' }">
          <span *ngFor="let news of newsList">&#x25cf; {{ news.headline }}</span>
        </div>
      </div>

      <button class="swiper-nav-btn prev" *ngIf="newsList.length > 1" (click)="swiperNews.swiper.slidePrev()">
        <ion-icon name="chevron-back"></ion-icon>
      </button>
      <button class="swiper-nav-btn next" *ngIf="newsList.length > 1" (click)="swiperNews.swiper.slideNext()">
        <ion-icon name="chevron-forward"></ion-icon>
      </button>
    </div>

    <ng-template #loading>
      <div class="loading-wrap">
        <div class="skeleton" style="height: 220px; width: 33%; border-radius: 0;"></div>
        <div style="flex: 1; padding: 1.5rem; display: flex; flex-direction: column; gap: 0.6rem;">
          <div class="skeleton" style="height: 14px; width: 40%; border-radius: 6px;"></div>
          <div class="skeleton" style="height: 20px; width: 80%; border-radius: 6px;"></div>
          <div class="skeleton" style="height: 12px; width: 100%; border-radius: 6px;"></div>
          <div class="skeleton" style="height: 12px; width: 90%; border-radius: 6px;"></div>
        </div>
      </div>
    </ng-template>
  </ion-card-content>
</ion-card>
