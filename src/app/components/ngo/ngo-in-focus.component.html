<ion-card class="wiof-ngo-in-focus-container" *ngIf="ngosInFocus?.length > 0">
  <ion-card-header class="wiof-slider-header">
    <span class="header-badge">
      <ion-icon aria-hidden="true" name="briefcase-outline"></ion-icon>
      Firm in Focus
    </span>
  </ion-card-header>

  <ion-card-content class="ion-no-padding background">
    <swiper-container #swiperNgo [attr.slides-per-view]="1" [attr.space-between]="10">
      <swiper-slide *ngFor="let ngoInFocus of ngosInFocus">
        <div class="ngo-slide">

          <!-- ── Media — click opens modal ──────────────────────────── -->
          <div
            class="media-container"
            (click)="ngoInFocus.mediaType == 'image' ? openModal(ngoInFocus, $event) : null"
            [class.clickable]="ngoInFocus.mediaType == 'image'"
            [attr.title]="ngoInFocus.mediaType == 'image' ? 'Click to view details' : null"
          >
            <div class="media-inner">
              <img
                class="media-player"
                [src]="ngoInFocus.image$ | async"
                [alt]="ngoInFocus.ngoName"
                *ngIf="ngoInFocus.mediaType == 'image'"
              />
              <div class="video-wrap" *ngIf="ngoInFocus.mediaType == 'video'">
                <iframe
                  class="media-player"
                  [title]="ngoInFocus.ngoName"
                  [src]="ngoInFocus.sanitizedLink"
                  allowfullscreen
                  appYoutubeWatchTracker
                  [contentId]="ngoInFocus.id || ngoInFocus.ngoName"
                  [videoTitle]="ngoInFocus.ngoName"
                  (watchComplete)="onVideoWatchComplete($event)"
                ></iframe>
              </div>
            </div>
            <!-- Expand hint overlay on image -->
            <div class="media-expand-hint" *ngIf="ngoInFocus.mediaType == 'image'">
              <ion-icon aria-hidden="true" name="expand-outline"></ion-icon>
            </div>
          </div>

          <!-- ── Content ────────────────────────────────────────────── -->
          <div class="ngo-content">
            <!-- <div class="ngo-header">
              <img
                [src]="ngoInFocus.logoImage$ | async"
                class="logo"
                [alt]="ngoInFocus.ngoName + ' logo'"
              />
              <h2 class="ngo-name">{{ ngoInFocus.ngoName }}</h2>
            </div> -->

            <div class="ngo-section">
              <span class="section-label">Focus Areas</span>
              <div class="tags-list">
                <span
                  class="home-key-tag"
                  *ngFor="let activity of ngoInFocus.keyActivities.split(',')"
                >{{ activity.trim() }}</span>
              </div>
            </div>

            <!-- <p class="ngo-description">{{ ngoInFocus.description }}</p> -->

            <div class="ngo-cta">
              <a
                [href]="ngoInFocus.knowMoreLink"
                target="_blank"
                rel="noopener"
                class="wiof-primary-link"
              >Visit Website</a>
            </div>
          </div>

        </div>
      </swiper-slide>
    </swiper-container>
    <button aria-label="Previous slide" class="swiper-nav-btn prev" *ngIf="ngosInFocus.length > 1" (click)="swiperNgo.swiper.slidePrev()">
      <ion-icon aria-hidden="true" name="chevron-back"></ion-icon>
    </button>
    <button aria-label="Next slide" class="swiper-nav-btn next" *ngIf="ngosInFocus.length > 1" (click)="swiperNgo.swiper.slideNext()">
      <ion-icon aria-hidden="true" name="chevron-forward"></ion-icon>
    </button>
  </ion-card-content>
</ion-card>
