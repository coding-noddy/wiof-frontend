<div class="video-slider-section" *ngIf="videoList && videoList.length > 0">

  <!-- Slider -->
  <div *ngIf="videoList; else loading" class="slider-wrap">
    <swiper-container
      #swiperRef
      [attr.slides-per-view]="4"
      [attr.space-between]="10"
      [attr.free-mode]="true"
      breakpoints='{"0":{"slidesPerView":1},"480":{"slidesPerView":2},"767":{"slidesPerView":3},"1024":{"slidesPerView":4}}'
    >
      <swiper-slide *ngFor="let video of videoList">
        <app-video-card [video]="video" [element]="element"></app-video-card>
      </swiper-slide>
    </swiper-container>

    <button class="swiper-nav-btn prev" (click)="swiperRef.swiper.slidePrev()" *ngIf="showNavigator()">
      <ion-icon name="chevron-back"></ion-icon>
    </button>
    <button class="swiper-nav-btn next" (click)="swiperRef.swiper.slideNext()" *ngIf="showNavigator()">
      <ion-icon name="chevron-forward"></ion-icon>
    </button>
  </div>

  <!-- Trailing action, below the cards -->
  <div class="video-slider-actions">
    <a
      [routerLink]="['videos']"
      class="action-link"
      title="View all videos"
      aria-label="View all videos"
    >
      View All <ion-icon name="arrow-forward-outline"></ion-icon>
    </a>
  </div>

  <ng-template #loading>
    <div class="loading-wrap">
      <ion-spinner name="crescent"></ion-spinner>
    </div>
  </ng-template>
</div>
